spring.application.name=hotel-reservation-system
server.port=8080

# ---- Datasource (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Connection pool (HikariCP) ----
spring.datasource.hikari.pool-name=HotelPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.cache-names=roomTypes,amenities
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ---- Scheduler (marks finished stays as COMPLETED) ----
hotel.scheduler.enabled=true
# run every N milliseconds (3600000 = 1 hour; use 60000 = 1 minute while testing)
hotel.scheduler.complete-stays-rate-ms=3600000

# ---- Seeded demo users (created only on an empty database) ----
hotel.seed.enabled=false
hotel.seed.admin-username=admin
hotel.seed.admin-password=admin123
hotel.seed.guest-username=guest
hotel.seed.guest-password=guest123

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics,caches,scheduledtasks,loggers
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Hotel Reservation System
info.app.version=1.0.0

# ---- OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---- Logging ----
logging.level.root=INFO
logging.level.com.example.hotelreservation=DEBUG
