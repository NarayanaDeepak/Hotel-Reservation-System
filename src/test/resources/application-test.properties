# Tests always use in-memory H2 and fixed seed users, whatever environment variables are set on the machine.
spring.datasource.url=jdbc:h2:mem:hoteltestdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
hotel.seed.enabled=true
hotel.seed.admin-username=admin
hotel.seed.admin-password=admin123
hotel.seed.guest-username=guest
hotel.seed.guest-password=guest123
hotel.scheduler.enabled=false
logging.level.com.example.hotelreservation=INFO
spring.jpa.properties.hibernate.format_sql=false
